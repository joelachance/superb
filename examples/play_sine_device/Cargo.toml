[package]
name = "play_sine_device"
description = "Plays a sine on the default output device via cpal (requires --features devices and audio hardware)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
devices = ["superb/devices"]

[[bin]]
name = "play_sine_device"
required-features = ["devices"]

[dependencies]
superb = { workspace = true }
