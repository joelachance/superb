[package]
name = "superb"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "A toolkit for building a digital audio workstation: everyday flows on top of real-time-safe primitives"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/superb-audio/superb-sdk"
keywords = ["audio", "daw", "realtime", "midi"]
categories = ["multimedia::audio"]
autoexamples = false

[features]
default = ["clap"]
# Real audio devices through cpal. Needs ALSA headers on Linux.
devices = ["dep:cpal"]
# Hardware MIDI input through midir. Needs ALSA headers on Linux.
midi-io = ["dep:midir"]
# Everything that talks to hardware.
hardware = ["devices", "midi-io"]
# Audio file decoding (symphonia, MPL-2.0, confined to src/primitives/io/files/decode.rs),
# resampling (rubato) and bounce helpers. Pure Rust, no hardware.
files = ["dep:symphonia", "dep:rubato"]
# CLAP plugin hosting through the clap-sys bindings (MIT/Apache-2.0) and libloading (ISC).
clap = ["dep:clap-sys", "dep:libloading"]

# Every default-feature dependency is Apache-2.0, MIT or ISC. The one MPL-2.0
# crate (symphonia) is opt-in and imported from exactly one source file.
[dependencies]
dasp_sample = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = { version = "0.18", optional = true }
midir = { version = "0.11", optional = true }
symphonia = { version = "0.6", default-features = false, features = ["wav", "flac", "pcm"], optional = true }
rubato = { version = "4", optional = true }
clap-sys = { version = "0.5", optional = true }
libloading = { version = "0.7", optional = true }

# Examples are grouped by tier. Run one with `cargo run --example <name>`.
[[example]]
name = "sine_through_graph"
path = "examples/primitives/sine_through_graph.rs"

[[example]]
name = "automation_gain_ramp"
path = "examples/primitives/automation_gain_ramp.rs"

[[example]]
name = "live_graph_edit"
path = "examples/primitives/live_graph_edit.rs"

[[example]]
name = "midi_route"
path = "examples/primitives/midi_route.rs"

[[example]]
name = "session_undo"
path = "examples/primitives/session_undo.rs"

[[example]]
name = "session_playback"
path = "examples/primitives/session_playback.rs"

[[example]]
name = "clap_host_scan"
path = "examples/primitives/clap_host_scan.rs"
required-features = ["clap"]

[[example]]
name = "decode_bounce"
path = "examples/primitives/decode_bounce.rs"
required-features = ["files"]

[[example]]
name = "play_sine_device"
path = "examples/primitives/play_sine_device.rs"
required-features = ["devices"]

[[example]]
name = "midi_monitor"
path = "examples/primitives/midi_monitor.rs"
required-features = ["midi-io"]

[[example]]
name = "transport_tempo_map"
path = "examples/primitives/transport_tempo_map.rs"

[[example]]
name = "realtime_queue"
path = "examples/primitives/realtime_queue.rs"

[[example]]
name = "new_song"
path = "examples/flows/new_song.rs"

[[example]]
name = "play_song"
path = "examples/flows/play_song.rs"

[[example]]
name = "mix_session"
path = "examples/flows/mix_session.rs"

[[example]]
name = "midi_keys"
path = "examples/flows/midi_keys.rs"

[[example]]
name = "record_take"
path = "examples/flows/record_take.rs"

[[example]]
name = "insert_plugin"
path = "examples/flows/insert_plugin.rs"
required-features = ["clap"]

[[example]]
name = "export_song"
path = "examples/flows/export_song.rs"

[[example]]
name = "list_devices"
path = "examples/flows/list_devices.rs"
required-features = ["devices"]

# A single package; the empty table stops Cargo looking for a parent workspace.
[workspace]

[profile.release]
debug = 1
