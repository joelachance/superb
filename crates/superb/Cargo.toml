[package]
name = "superb"
description = "Superb DAW SDK facade: re-exports Phase 1 crates plus Phase 2 automation, undo and session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Real audio devices through cpal (needs ALSA headers on Linux).
devices = ["superb-io/devices"]
# Hardware MIDI input through midir (needs ALSA headers on Linux).
midi-io = ["superb-midi/midir"]
# Everything that talks to hardware.
hardware = ["devices", "midi-io"]
# File decoding (symphonia, MPL-2.0 isolated in superb-io), resampling (rubato) and bounce helpers.
files = ["superb-io/files"]

[dependencies]
superb-core = { workspace = true }
superb-buffers = { workspace = true }
superb-rt = { workspace = true }
superb-transport = { workspace = true }
superb-midi = { workspace = true }
superb-graph = { workspace = true }
superb-mixer = { workspace = true }
superb-automation = { workspace = true }
superb-undo = { workspace = true }
superb-session = { workspace = true }
superb-plugins = { workspace = true }
superb-io = { workspace = true }
